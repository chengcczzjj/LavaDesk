appId: com.lavadesk.app
productName: LavaDesk
asar: true
directories:
  buildResources: resources/build
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
extraResources:
  - from: resources/build
    to: build
    filter: ['icon.*']
  - from: assets
    to: assets
    filter: ['**/*']
win:
  icon: resources/build/icon.ico
  executableName: LavaDesk
nsis:
  artifactName: LavaDesk-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
publish:
  - provider: github
    owner: chengcczzjj
    repo: LavaDesk
    releaseType: release
